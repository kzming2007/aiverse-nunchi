<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14123a">
  <title>AI 눈치게임</title>
  <link rel="icon" type="image/webp" href="/flight/cap-red.webp">
  <link rel="preload" as="font" type="font/woff2" href="/flight/font/Galmuri11.woff2" crossorigin>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/game.css">
  <link rel="stylesheet" href="/flight.css">
  <link rel="preload" as="image" href="/flight/bridge.webp">
</head>
<body class="game">
  <div class="stars"></div>

  <header class="topbar">
    <div>AI:VERSE · <b>Aeye</b> AI 눈치게임</div>
    <div><button type="button" id="sound-toggle" aria-pressed="false">소리 꺼짐</button><button type="button" id="music-toggle" aria-pressed="false" hidden>배경음 꺼짐</button> <span id="station"></span> · <span id="conn" class="conn">서버 확인 중…</span></div>
  </header>

  <main>
    <!-- 우주 정거장 장면: 전광판 → 시간 막대 → 창밖 우주 앞 AI 3명 → 빨간 책상의 내 버튼 -->
    <section id="stage" class="stage">
      <div class="stage-sky" aria-hidden="true"><span class="planet"></span><span class="ringed"></span></div>
      <div class="sign">
        <div class="sign-side">라운드<b id="round">-</b></div>
        <div class="sign-main">
          <div id="big" class="big"></div>
          <div id="sub" class="sub"></div>
        </div>
        <div class="sign-side">점수<b id="score">0</b></div>
      </div>
      <div class="timebar"><div id="timefill"></div></div>
      <div id="warn" class="warn" role="status" aria-live="polite"></div>
      <div id="ai-seats" class="ai-seats"></div>
      <div class="desk">
        <div id="player-seat" class="player-row"></div>
      </div>
    </section>

  <div id="entry" class="overlay hidden">
    <form id="entry-form" class="entry-card" autocomplete="off">
      <div id="entry-title" class="entry-title">닉네임</div>
      <input id="entry-name" maxlength="12" spellcheck="false" autocomplete="off" aria-label="닉네임">
      <div id="entry-name-hint" class="entry-hint">비워 두면 추천 닉네임으로 시작합니다.</div>
      <div id="entry-collect" class="entry-collect hidden">
        <div id="entry-collect-hint" class="entry-collect-hint">수집 모드는 <b>매번 같은 가명</b>을 직접 입력해요 (실명 X). 이 기기에서 쓴 가명은 다음에 자동으로 채워져요</div>
        <label for="entry-label">연기할 유형</label>
        <select id="entry-label"></select>
        <div class="entry-hint">한 게임 동안 이 유형 하나만 진지하게 연기해 주세요. 연타는 금지! 이 기록은 랭킹에 올라가지 않아요.</div>
      </div>
      <button type="submit" class="entry-start">게임 시작</button>
      <div id="entry-notice" class="entry-notice">플레이 기록(닉네임과 누른 시각)은 랭킹과 AI 학습에 쓰여요</div>
    </form>
  </div>

    <section id="timeline" class="timeline-box"></section>

    <section id="ai-panel" class="ai-panel hidden" aria-live="polite"></section>

    <p class="keyhint"><kbd>Space</kbd> 또는 빨간 버튼 누르기</p>
  </main>

  <!-- 휴대폰·태블릿: 엄지로 누르는 큰 버튼 (터치 기기에서만 보임) -->
  <button id="tap" class="tap-btn wait" type="button" aria-label="버튼 누르기">준비…</button>

  <div id="final" class="overlay hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/db.js"></script>
  <script src="/shared.js"></script>
  <script src="/ai/params.js"></script>
  <script src="/ai/model.js"></script>
  <script src="/ai/planner.js"></script>
  <script src="/flight.js"></script>
  <script src="/game.js"></script>
</body>
</html>
